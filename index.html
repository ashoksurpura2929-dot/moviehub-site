<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b14">
<title>MovieHub - Movie Search</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #080b14;
  color: white;
  min-height: 100vh;
}

header {
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #252b3a;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  color: #f5bd52;
}

.logo span {
  color: white;
}

.bot-link {
  text-decoration: none;
  color: white;
  background: #1769dc;
  padding: 10px 15px;
  border-radius: 20px;
  font-size: 13px;
}

.hero {
  text-align: center;
  padding: 55px 18px 35px;
  background: radial-gradient(ellipse at top, #25294c, #080b14 70%);
}

.hero h1 {
  font-size: clamp(32px, 7vw, 48px);
  margin-bottom: 12px;
}

.hero h1 span {
  color: #f5bd52;
}

.hero p {
  color: #aeb6c9;
  line-height: 1.6;
  margin-bottom: 25px;
}

.search {
  display: flex;
  max-width: 550px;
  margin: auto;
  background: #1a2030;
  border: 1px solid #3a4256;
  border-radius: 12px;
  overflow: hidden;
}

.search input {
  flex: 1;
  min-width: 0;
  padding: 16px;
  background: transparent;
  color: white;
  border: none;
  outline: none;
  font-size: 15px;
}

.search button {
  background: #e9ad3c;
  color: #111;
  border: none;
  padding: 0 20px;
  font-weight: bold;
  cursor: pointer;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 30px 18px;
}

.section-title {
  font-size: 22px;
  margin-bottom: 20px;
}

.movies {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 16px;
}

.movie {
  background: #151b29;
  border: 1px solid #272f41;
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.poster {
  height: 150px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(145deg, #343e64, #171b2c);
  font-size: 50px;
}

.movie-info {
  padding: 13px;
  display: flex;
  flex-direction: column;
  flex: 1;
  justify-content: space-between;
}

.movie-info h3 {
  font-size: 14px;
  margin-bottom: 7px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  line-height: 1.35;
}

.movie-info p {
  color: #aab3c5;
  font-size: 12px;
  margin-bottom: 12px;
}

.details {
  width: 100%;
  padding: 9px;
  border: none;
  border-radius: 7px;
  background: #e9ad3c;
  color: #111;
  font-weight: bold;
  cursor: pointer;
}

#message {
  color: #aab3c5;
  text-align: center;
  padding: 25px 5px;
}

footer {
  text-align: center;
  color: #8790a4;
  padding: 25px 15px;
  border-top: 1px solid #252b3a;
  font-size: 13px;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: #000c;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 999;
}

.modal-content {
  background: #1a2030;
  border: 1px solid #3a4256;
  padding: 25px;
  border-radius: 14px;
  max-width: 400px;
  width: 100%;
}

.modal-content h2 {
  margin-bottom: 12px;
  color: #f5bd52;
  font-size: 18px;
  word-break: break-word;
}

.modal-content p {
  color: #c2c9d7;
  line-height: 1.6;
  margin-bottom: 18px;
  font-size: 14px;
  word-break: break-word;
}

.modal-actions {
  display: flex;
  gap: 10px;
}

.get-btn {
  flex: 1;
  background: #1769dc;
  color: white;
  border: none;
  padding: 10px 16px;
  border-radius: 7px;
  font-weight: bold;
  cursor: pointer;
}

.close {
  background: #e9ad3c;
  color: #111;
  border: none;
  padding: 10px 18px;
  border-radius: 7px;
  font-weight: bold;
  cursor: pointer;
}

@media(max-width: 380px) {
  .movies {
    grid-template-columns: repeat(2, 1fr);
  }
  .poster {
    height: 130px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">MOVIE<span>HUB</span> 🎬</div>
  <a class="bot-link"
     href="https://t.me/MyMovieHub2026Bot"
     target="_blank" rel="noopener">
     Open Bot
  </a>
</header>

<section class="hero">
  <h1>Discover <span>Movies</span></h1>
  <p>Search your favorite movies and explore your movie library.</p>

  <div class="search">
    <input id="searchInput"
           type="search"
           placeholder="Search movies..."
           aria-label="Search movies">
    <button id="searchButton">Search</button>
  </div>
</section>

<main>
  <h2 class="section-title">🎬 Movie Collection</h2>

  <div class="movies" id="movieList"></div>
  <div id="message" role="status">Loading movies...</div>
</main>

<div class="modal" id="movieModal" role="dialog"
     aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-content">
    <h2 id="modalTitle"></h2>
    <p id="modalDescription"></p>
    <div class="modal-actions">
      <button class="get-btn" id="getMovieBtn">📥 Get in Bot</button>
      <button class="close" id="closeModal">Close</button>
    </div>
  </div>
</div>

<footer>
  © 2026 MovieHub. All rights reserved.
  <br><br>
  Your Movie Search Destination 🎥
</footer>

<script>
"use strict";

const API_URL = "https://moviehub-bot.onrender.com/api/movies";
const BOT_USERNAME = "MyMovieHub2026Bot";

const movieList = document.getElementById("movieList");
const searchInput = document.getElementById("searchInput");
const message = document.getElementById("message");
const modal = document.getElementById("movieModal");
const getMovieBtn = document.getElementById("getMovieBtn");

let selectedMovieId = null;
let searchTimer = null;

if (window.Telegram && window.Telegram.WebApp) {
  window.Telegram.WebApp.ready();
  window.Telegram.WebApp.expand();
}

function openMovieInBot(movieId) {
  const link = `https://t.me/${BOT_USERNAME}?start=${encodeURIComponent(movieId)}`;
  if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openTelegramLink) {
    window.Telegram.WebApp.openTelegramLink(link);
    window.Telegram.WebApp.close();
  } else {
    window.open(link, "_blank", "noopener");
  }
}

function renderMovies(items) {
  movieList.replaceChildren();

  message.textContent = items.length
    ? ""
    : "No movies found. Try another search.";

  items.forEach(movie => {
    const card = document.createElement("article");
    card.className = "movie";

    const poster = document.createElement("div");
    poster.className = "poster";
    poster.textContent = "🎬";

    const info = document.createElement("div");
    info.className = "movie-info";

    const title = document.createElement("h3");
    title.textContent = movie.title;

    const meta = document.createElement("p");
    meta.textContent = `📦 ${movie.size}`;

    const button = document.createElement("button");
    button.className = "details";
    button.textContent = "View Details";

    button.addEventListener("click", () => {
      selectedMovieId = movie.id;
      document.getElementById("modalTitle").textContent = movie.title;
      document.getElementById("modalDescription").textContent =
        `📦 File Size: ${movie.size}\n\nClick "Get in Bot" to receive this movie directly in @${BOT_USERNAME}.`;
      modal.style.display = "flex";
    });

    info.append(title, meta, button);
    card.append(poster, info);
    movieList.append(card);
  });
}

async function fetchMovies(query = "") {
  message.textContent = query ? `Searching "${query}"...` : "Loading movies...";
  try {
    const url = query
      ? `${API_URL}?q=${encodeURIComponent(query)}`
      : API_URL;

    const res = await fetch(url);
    if (!res.ok) throw new Error("Server error");

    const data = await res.json();
    renderMovies(data);
  } catch (err) {
    movieList.replaceChildren();
    message.textContent = "⚠️ Movies load nahi ho pa rahi hain. Bot server check karein.";
  }
}

getMovieBtn.addEventListener("click", () => {
  if (selectedMovieId) {
    openMovieInBot(selectedMovieId);
  }
});

document.getElementById("searchButton").addEventListener("click", () => {
  fetchMovies(searchInput.value.trim());
});

searchInput.addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    fetchMovies(searchInput.value.trim());
  }, 350);
});

document.getElementById("closeModal").addEventListener("click", () => {
  modal.style.display = "none";
});

modal.addEventListener("click", event => {
  if (event.target === modal) modal.style.display = "none";
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") modal.style.display = "none";
});

fetchMovies();
</script>

</body>
</html>
