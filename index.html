<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b14">
<title>MovieHub - Movie Search</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #080b14;
  color: white;
  min-height: 100vh;
}

header {
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #252b3a;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  color: #f5bd52;
}

.logo span {
  color: white;
}

.bot-link {
  text-decoration: none;
  color: white;
  background: #1769dc;
  padding: 10px 15px;
  border-radius: 20px;
  font-size: 13px;
}

.hero {
  text-align: center;
  padding: 50px 18px 32px;
  background: radial-gradient(ellipse at top, #25294c, #080b14 70%);
}

.hero h1 {
  font-size: clamp(30px, 7vw, 46px);
  margin-bottom: 12px;
}

.hero h1 span {
  color: #f5bd52;
}

.hero p {
  color: #aeb6c9;
  line-height: 1.6;
  margin-bottom: 24px;
}

.search {
  display: flex;
  max-width: 550px;
  margin: auto;
  background: #1a2030;
  border: 1px solid #3a4256;
  border-radius: 12px;
  overflow: hidden;
}

.search input {
  flex: 1;
  min-width: 0;
  padding: 15px;
  background: transparent;
  color: white;
  border: none;
  outline: none;
  font-size: 15px;
}

.search button {
  background: #e9ad3c;
  color: #111;
  border: none;
  padding: 0 20px;
  font-weight: bold;
  cursor: pointer;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 28px 18px;
}

.section-title {
  font-size: 21px;
  margin-bottom: 18px;
}

.movies {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 16px;
}

.movie {
  background: #151b29;
  border: 1px solid #272f41;
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
}

.folder-badge {
  position: absolute;
  top: 8px;
  right: 8px;
  background: rgba(8, 11, 20, 0.88);
  border: 1px solid #f5bd52;
  color: #f5bd52;
  font-size: 11px;
  font-weight: bold;
  padding: 4px 8px;
  border-radius: 8px;
  z-index: 2;
}

.poster {
  height: 225px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(145deg, #343e64, #171b2c);
  font-size: 50px;
  overflow: hidden;
}

.poster img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.movie-info {
  padding: 12px;
  display: flex;
  flex-direction: column;
  flex: 1;
  justify-content: space-between;
}

.movie-info h3 {
  font-size: 14px;
  margin-bottom: 6px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  line-height: 1.35;
}

.movie-info p {
  color: #aab3c5;
  font-size: 12px;
  margin-bottom: 10px;
}

.details {
  width: 100%;
  padding: 9px;
  border: none;
  border-radius: 7px;
  background: #e9ad3c;
  color: #111;
  font-weight: bold;
  cursor: pointer;
}

#message {
  color: #aab3c5;
  text-align: center;
  padding: 25px 5px;
}

footer {
  text-align: center;
  color: #8790a4;
  padding: 25px 15px;
  border-top: 1px solid #252b3a;
  font-size: 13px;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.82);
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 999;
}

.modal-content {
  background: #1a2030;
  border: 1px solid #3a4256;
  padding: 20px;
  border-radius: 14px;
  max-width: 440px;
  width: 100%;
  max-height: 82vh;
  display: flex;
  flex-direction: column;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
  border-bottom: 1px solid #2b3347;
  padding-bottom: 10px;
}

.modal-header h2 {
  color: #f5bd52;
  font-size: 17px;
  word-break: break-word;
}

.close-x {
  background: #2b3347;
  color: white;
  border: none;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  font-weight: bold;
  cursor: pointer;
  flex-shrink: 0;
}

.episode-list {
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-right: 4px;
}

.episode-item {
  background: #121724;
  border: 1px solid #293246;
  border-radius: 10px;
  padding: 11px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.episode-meta {
  flex: 1;
  min-width: 0;
}

.episode-title {
  font-size: 13px;
  color: #fff;
  margin-bottom: 4px;
  word-break: break-word;
  line-height: 1.35;
}

.episode-size {
  font-size: 11px;
  color: #9ba5bc;
}

.ep-get-btn {
  background: #1769dc;
  color: white;
  border: none;
  padding: 8px 13px;
  border-radius: 7px;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
  flex-shrink: 0;
}

@media(max-width: 380px) {
  .movies {
    grid-template-columns: repeat(2, 1fr);
  }
  .poster {
    height: 195px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">MOVIE<span>HUB</span> 🎬</div>
  <a class="bot-link"
     href="https://t.me/MyMovieHub2026Bot"
     target="_blank" rel="noopener">
     Open Bot
  </a>
</header>

<section class="hero">
  <h1>Discover <span>Movies</span></h1>
  <p>Search your favorite movies & web series folders.</p>

  <div class="search">
    <input id="searchInput"
           type="search"
           placeholder="Search movies or series..."
           aria-label="Search movies">
    <button id="searchButton">Search</button>
  </div>
</section>

<main>
  <h2 class="section-title">📁 Movie & Series Folders</h2>

  <div class="movies" id="movieList"></div>
  <div id="message" role="status">Loading library...</div>
</main>

<div class="modal" id="movieModal" role="dialog"
     aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modalTitle"></h2>
      <button class="close-x" id="closeModal" aria-label="Close">✕</button>
    </div>
    <div class="episode-list" id="episodeList"></div>
  </div>
</div>

<footer>
  © 2026 MovieHub. All rights reserved.
  <br><br>
  Your Movie Search Destination 🎥
</footer>

<script>
"use strict";

const API_URL = "https://moviehub-bot.onrender.com/api/movies";
const BOT_USERNAME = "MyMovieHub2026Bot";

const movieList = document.getElementById("movieList");
const searchInput = document.getElementById("searchInput");
const message = document.getElementById("message");
const modal = document.getElementById("movieModal");
const episodeList = document.getElementById("episodeList");

let searchTimer = null;

if (window.Telegram && window.Telegram.WebApp) {
  window.Telegram.WebApp.ready();
  window.Telegram.WebApp.expand();
}

function openMovieInBot(movieId) {
  const link = `https://t.me/${BOT_USERNAME}?start=${encodeURIComponent(movieId)}`;
  if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openTelegramLink) {
    window.Telegram.WebApp.openTelegramLink(link);
    window.Telegram.WebApp.close();
  } else {
    window.open(link, "_blank", "noopener");
  }
}

function openFolderModal(folder) {
  document.getElementById("modalTitle").textContent =
    folder.count > 1 ? `📁 ${folder.folder_name} (${folder.count})` : `🎬 ${folder.folder_name}`;

  episodeList.replaceChildren();

  folder.items.forEach(item => {
    const row = document.createElement("div");
    row.className = "episode-item";

    const meta = document.createElement("div");
    meta.className = "episode-meta";

    const title = document.createElement("div");
    title.className = "episode-title";
    title.textContent = item.title;

    const size = document.createElement("div");
    size.className = "episode-size";
    size.textContent = `📦 ${item.size}`;

    meta.append(title, size);

    const btn = document.createElement("button");
    btn.className = "ep-get-btn";
    btn.textContent = "📥 Get";
    btn.addEventListener("click", () => openMovieInBot(item.id));

    row.append(meta, btn);
    episodeList.append(row);
  });

  modal.style.display = "flex";
}

function renderMovies(folders) {
  movieList.replaceChildren();

  message.textContent = folders.length
    ? ""
    : "No movies or series found. Try another search.";

  folders.forEach(folder => {
    const card = document.createElement("article");
    card.className = "movie";

    if (folder.count > 1) {
      const badge = document.createElement("div");
      badge.className = "folder-badge";
      badge.textContent = `📁 ${folder.count} Parts`;
      card.append(badge);
    }

    const poster = document.createElement("div");
    poster.className = "poster";

    if (folder.poster && folder.poster.startsWith("http")) {
      const img = document.createElement("img");
      img.src = folder.poster;
      img.alt = folder.folder_name;
      img.loading = "lazy";
      img.onerror = () => {
        poster.textContent = "🎬";
      };
      poster.append(img);
    } else {
      poster.textContent = "🎬";
    }

    const info = document.createElement("div");
    info.className = "movie-info";

    const title = document.createElement("h3");
    title.textContent = folder.folder_name;

    const metaParts = [];
    if (folder.year) metaParts.push(folder.year);
    if (folder.genre) metaParts.push(folder.genre);
    metaParts.push(folder.size);

    const meta = document.createElement("p");
    meta.textContent = metaParts.join(" • ");

    const button = document.createElement("button");
    button.className = "details";
    button.textContent = folder.count > 1 ? `📁 Open (${folder.count})` : "View Details";
    button.addEventListener("click", () => openFolderModal(folder));

    info.append(title, meta, button);
    card.append(poster, info);
    movieList.append(card);
  });
}

async function fetchMovies(query = "") {
  message.textContent = query ? `Searching "${query}"...` : "Loading library...";
  try {
    const url = query
      ? `${API_URL}?q=${encodeURIComponent(query)}`
      : API_URL;

    const res = await fetch(url);
    if (!res.ok) throw new Error("Server error");

    const data = await res.json();
    renderMovies(data);
  } catch (err) {
    movieList.replaceChildren();
    message.textContent = "⚠️ Library load nahi ho pa rahi hai. Bot server check karein.";
  }
}

document.getElementById("searchButton").addEventListener("click", () => {
  fetchMovies(searchInput.value.trim());
});

searchInput.addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    fetchMovies(searchInput.value.trim());
  }, 350);
});

document.getElementById("closeModal").addEventListener("click", () => {
  modal.style.display = "none";
});

modal.addEventListener("click", event => {
  if (event.target === modal) modal.style.display = "none";
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") modal.style.display = "none";
});

fetchMovies();
</script>

</body>
</html>
